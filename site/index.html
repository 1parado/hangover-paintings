<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画橱 · Gallery</title>
<style>
  :root {
    --gold: #c9a86a;
    --gold-dim: #8a744a;
    --ink: #0e0c0a;
    --paper: #f2ead9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }

  #stage { position: fixed; inset: 0; display: block; }

  /* ---------- loading ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50; background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--gold); transition: opacity .8s ease; gap: 18px;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(201,168,106,.25); border-top-color: var(--gold);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .txt { letter-spacing: .5em; font-size: 14px; text-indent: .5em; opacity: .8; }

  /* ---------- header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px; pointer-events: none;
  }
  header .brand { color: var(--paper); font-size: 20px; letter-spacing: .35em; text-indent: .35em; }
  header .brand small { display: block; color: var(--gold-dim); font-size: 10px; letter-spacing: .6em; margin-top: 6px; }
  header .hint { color: rgba(242,234,217,.45); font-size: 12px; letter-spacing: .2em; }

  /* ---------- price panel ---------- */
  #pricePanel {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    z-index: 10; width: 252px; max-height: 78vh;
    background: linear-gradient(160deg, rgba(24,20,15,.92), rgba(12,10,8,.94));
    border: 1px solid rgba(201,168,106,.35); border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 40px rgba(201,168,106,.05);
    padding: 24px 22px; overflow-y: auto; backdrop-filter: blur(8px);
    transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .5s;
  }
  #pricePanel.hidden-panel { transform: translateY(-50%) translateX(300px); opacity: 0; }
  #pricePanel::before {
    content: ""; position: absolute; inset: 6px; pointer-events: none;
    border: 1px solid rgba(201,168,106,.18);
  }
  #pricePanel h2 {
    color: var(--gold); font-size: 17px; letter-spacing: .5em; text-indent: .5em;
    text-align: center; margin-bottom: 4px; font-weight: 500;
  }
  #pricePanel .sub { color: var(--gold-dim); font-size: 10px; letter-spacing: .3em; text-align: center; margin-bottom: 18px; }
  #pricePanel ul { list-style: none; }
  #pricePanel li {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 2px; color: var(--paper); font-size: 13.5px; letter-spacing: .08em;
    border-bottom: 1px dashed rgba(201,168,106,.18);
  }
  #pricePanel li .price { color: var(--gold); font-size: 15px; }
  #pricePanel .note {
    margin-top: 16px; color: rgba(242,234,217,.5); font-size: 11.5px;
    line-height: 1.9; letter-spacing: .05em;
  }
  #pricePanel .note b { color: var(--gold); font-weight: normal; }

  /* ---------- toggle ---------- */
  #togglePrice {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 11; width: 34px; height: 76px;
    background: rgba(24,20,15,.9); border: 1px solid rgba(201,168,106,.35); border-right: none;
    color: var(--gold); cursor: pointer; font-size: 13px; letter-spacing: .1em;
    writing-mode: vertical-lr; display: flex; align-items: center; justify-content: center;
    transition: right .5s cubic-bezier(.22,1,.36,1);
  }
  body.panel-open #togglePrice { right: 284px; }

  /* ---------- artwork info card ---------- */
  #infoCard {
    position: fixed; left: 32px; bottom: 32px; z-index: 10;
    max-width: 340px; padding: 20px 24px;
    background: linear-gradient(160deg, rgba(24,20,15,.92), rgba(12,10,8,.94));
    border: 1px solid rgba(201,168,106,.35); border-left: 3px solid var(--gold);
    color: var(--paper); opacity: 0; transform: translateY(16px);
    transition: opacity .45s ease, transform .45s ease; pointer-events: none;
  }
  #infoCard.show { opacity: 1; transform: translateY(0); }
  #infoCard .title { font-size: 17px; letter-spacing: .15em; color: var(--gold); margin-bottom: 8px; }
  #infoCard .desc { font-size: 12.5px; line-height: 1.8; color: rgba(242,234,217,.75); letter-spacing: .06em; }

  /* ---------- footer ---------- */
  footer {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(242,234,217,.35); font-size: 11px; letter-spacing: .35em; z-index: 10; pointer-events: none;
  }

  @media (max-width: 768px) {
    header { padding: 16px 18px; }
    header .brand { font-size: 15px; letter-spacing: .25em; }
    header .hint { display: none; }
    #pricePanel { width: min(78vw, 252px); right: 16px; }
    body.panel-open #togglePrice { right: calc(min(78vw, 252px) + 16px); }
    #infoCard { left: 16px; right: 16px; bottom: 16px; max-width: none; }
    footer { display: none; }
  }
</style>
</head>
<body class="panel-open">

<canvas id="stage"></canvas>

<div id="loader">
  <div class="ring"></div>
  <div class="txt">橱窗布置中</div>
</div>

<header>
  <div class="brand">画 橱<small>ART&nbsp;SHOWCASE</small></div>
  <div class="hint">拖动环视 · 滚轮缩放 · 点击画作查看</div>
</header>

<button id="togglePrice" title="展开/收起价目表">❦ 价目 ❦</button>

<aside id="pricePanel">
  <h2>稿价一览</h2>
  <div class="sub">COMMISSION&nbsp;PRICE</div>
  <ul>
    <li><span>大头线稿</span><span class="price">15r</span></li>
    <li><span>大头上色</span><span class="price">25r</span></li>
    <li><span>请吃Q版小人</span><span class="price">25r</span></li>
    <li><span>全身摸鱼线稿</span><span class="price">35r</span></li>
    <li><span>全身立绘线稿</span><span class="price">50r</span></li>
    <li><span>全身立绘上色＋背景</span><span class="price">200r</span></li>
    <li><span>大场景 or 刁钻角度</span><span class="price">300r</span></li>
    <li><span>小漫画 OC 剧情 4p</span><span class="price">250r</span></li>
  </ul>
  <div class="note">
    具体价格可详谈，以上只是预计价位～<br>
    加急：<b>＋15r</b> · 主包还是学生，请多关照<br>
    希望大家试吃愉快！
  </div>
</aside>

<div id="infoCard">
  <div class="title"></div>
  <div class="desc"></div>
</div>

<footer>DRAWINGS&nbsp;·&nbsp;2026</footer>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
               "tween": "https://unpkg.com/@tweenjs/tween.js@23.1.3/dist/tween.esm.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 数据 ================= */
const PRICES = {
  15:'大头线稿 · 15r', 25:'大头上色 · 25r', 35:'全身摸鱼线稿 · 35r', 50:'全身立绘线稿 · 50r'
};
const COUNT = 26;
const IMGS = [];
const EXT = { 9:'png', 13:'png', 15:'png' };
for (let i = 1; i <= COUNT; i++) IMGS.push(`img/art${String(i).padStart(2,'0')}.${EXT[i] || 'jpg'}`);

/* ================= 渲染器 / 场景 ================= */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1712);
scene.fog = new THREE.FogExp2(0x1c1712, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 2.0, 10.5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.2;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = false;

/* ================= 灯光 ================= */
scene.add(new THREE.AmbientLight(0xfff2dd, 1.6));

const keyLight = new THREE.DirectionalLight(0xfff0d8, 1.6);
keyLight.position.set(0, 8, 10);
scene.add(keyLight);

function spotlight(x, y, z, targetY = 1.7) {
  const s = new THREE.SpotLight(0xffeed0, 30, 18, 0.55, 0.7, 1.3);
  s.position.set(x, y, z);
  s.castShadow = false;
  scene.add(s, s.target);
  s.target.position.set(x, targetY, z * 0.2);
  return s;
}

/* ================= 房间 ================= */
const room = new THREE.Group();
scene.add(room);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xb8ab96, roughness: 0.92 });
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x5c4632, roughness: 0.35, metalness: 0.1
});
const R = 30;               // 展厅纵深（背景墙很远）
const H = 7;
const WALL_Z = -7;          // 正面展示墙
const WALL_W = 30;

// 地面
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
room.add(floor);

// 正面大墙 + 侧墙
const wallMat2 = wallMat.clone();
const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(WALL_W, H + 4), wallMat2);
frontWall.position.set(0, (H + 4)/2 - 0.5, WALL_Z);
frontWall.receiveShadow = true;
room.add(frontWall);
const sideL = new THREE.Mesh(new THREE.PlaneGeometry(40, H + 4), wallMat);
sideL.position.set(-WALL_W/2, 2.5, WALL_Z + 20); sideL.rotation.y = Math.PI/2;
room.add(sideL);
const sideR = sideL.clone(); sideR.position.x = WALL_W/2; sideR.rotation.y = -Math.PI/2;
room.add(sideR);

// 墙脚线
const trimMat = new THREE.MeshStandardMaterial({ color: 0x3a2f1e, roughness: .5, metalness: .6 });
const trimBox = new THREE.Mesh(new THREE.BoxGeometry(WALL_W + 1, 0.14, 0.2), trimMat);
trimBox.position.set(0, 0.07, WALL_Z + 0.1);
room.add(trimBox);

// 天花板
const ceiling2 = new THREE.Mesh(new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0xd8d0c0, roughness: 1 }));
ceiling2.rotation.x = Math.PI/2; ceiling2.position.y = H;
room.add(ceiling2);

// 天花板轨道灯条
const trackMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: .4, metalness: .7 });
const track = new THREE.Mesh(new THREE.BoxGeometry(WALL_W * 0.8, 0.06, 0.12), trackMat);
track.position.set(0, H - 0.1, WALL_Z + 2.2);
room.add(track);
for (let i = 0; i < 13; i++) {
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.07, 0.18, 10), trackMat);
  head.position.set(-WALL_W*0.4 + i * (WALL_W*0.8/12), H - 0.22, WALL_Z + 2.2);
  head.rotation.x = 0.45;
  room.add(head);
}

// 展厅长椅（两张）
const benchMat = new THREE.MeshStandardMaterial({ color: 0x4a3826, roughness: .55 });
function bench(x) {
  const b = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.55), benchMat);
  seat.position.y = 0.45; seat.castShadow = true; b.add(seat);
  [-0.9, 0.9].forEach(ox => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.45), benchMat);
    leg.position.set(ox, 0.22, 0); b.add(leg);
  });
  b.position.set(x, 0, 2.5);
  room.add(b);
}
bench(-4); bench(4);

/* ================= 画框 ================= */
const frameMat  = new THREE.MeshStandardMaterial({ color: 0x2e2114, roughness: 0.35, metalness: 0.55 });
const goldMat   = new THREE.MeshStandardMaterial({ color: 0x8a744a, roughness: 0.3,  metalness: 0.8 });
const planeGeo  = new THREE.PlaneGeometry(1, 1);

const paintings = [];
const loader = new THREE.TextureLoader();
let loaded = 0;

function addPainting(tex, idx) {
  const img = tex.image;
  const ratio = img.height / img.width;
  const W = 2.6 / Math.sqrt(ratio);   // 面积大致一致
  const Hh = W * ratio;
  const g = new THREE.Group();

  // 画框（外）
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W + 0.22, Hh + 0.22, 0.06), frameMat);
  g.add(frame);                                  // 前表面 z=0.03
  // 金边
  const bevel = new THREE.Mesh(new THREE.BoxGeometry(W + 0.12, Hh + 0.12, 0.06), goldMat);
  bevel.position.z = 0.04;                       // 前表面 z=0.07
  g.add(bevel);
  // 画布
  tex.colorSpace = THREE.SRGBColorSpace;
  const artMat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.9, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.08,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4
  });
  // 检测画面亮度：白纸线稿自动压暗，避免刺眼
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 16;
    const cx = c.getContext('2d');
    cx.drawImage(tex.image, 0, 0, 16, 16);
    const d = cx.getImageData(0, 0, 16, 16).data;
    let lum = 0;
    for (let i = 0; i < d.length; i += 4) lum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    lum /= d.length / 4;
    if (lum > 170) {                // 亮背景（未上色线稿）
      artMat.color = new THREE.Color(0xb9b2a6);   // 暖灰压暗
      artMat.emissiveIntensity = 0;
    }
  } catch (e) {}
  const art = new THREE.Mesh(planeGeo, artMat);
  art.scale.set(W, Hh, 1);
  art.position.z = 0.1;                          // 前表面 z=0.10，与金边差 0.03
  g.add(art);

  // 挂绳 + 钉子（装饰）
  const hook = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), goldMat);
  hook.position.set(0, Hh/2 + 0.28, 0.02);
  g.add(hook);

  // 画下方铭牌
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x6b5a3a, metalness: .7, roughness: .35 }));
  plate.position.set(0, -Hh/2 - 0.22, 0.02);
  g.add(plate);

  // ---- 放置：正面墙 2 行 × 13 列网格 ----
  const perRow = 13;
  const row = Math.floor(idx / perRow);             // 0 上排, 1 下排
  const col = idx % perRow;
  const cellW = WALL_W / perRow;
  const x = -WALL_W/2 + cellW * (col + 0.5);
  const y = row === 0 ? 2.9 : 0.9;
  // 每列宽度有限，画要缩小
  const scale = Math.min(1, cellW / (W + 0.5)) * 0.92;
  g.scale.setScalar(scale);
  g.position.set(x, y, WALL_Z + 0.15);

  // 每幅画前方上方一盏射灯（离墙 2.2，斜照画面）
  const sl = spotlight(g.position.x, 4.6, g.position.z + 2.2);
  sl.target.position.set(g.position.x, 1.6, g.position.z);

  g.userData = { idx, W, Hh };
  paintings.push(g);
  room.add(g);
}

IMGS.forEach((src, idx) => {
  loader.load(src, tex => {
    addPainting(tex, idx);
    if (++loaded === COUNT) init();
  }, undefined, () => { if (++loaded === COUNT) init(); }); // 失败也继续
});

/* ================= 交互 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null, focused = null, tweening = false;
const infoCard = document.getElementById('infoCard');

function pick(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(paintings, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o && !o.userData.idx) o = o.parent;
  return o && o.userData.idx ? o : null;
}

function setEmissive(p, v) {
  p.children.forEach(c => {
    if (c.material && c.material.emissiveMap) c.material.emissiveIntensity = v;
  });
}

canvas.addEventListener('pointermove', e => {
  if (tweening) return;
  const p = pick(e);
  if (p !== hovered) {
    if (hovered && hovered !== focused) setEmissive(hovered, 0.06);
    hovered = p;
    if (hovered) setEmissive(hovered, 0.35);
    canvas.style.cursor = hovered ? 'pointer' : 'grab';
  }
});

canvas.addEventListener('click', e => {
  const p = pick(e);
  if (!p) { unfocus(); return; }
  focus(p);
});

function focus(p) {
  if (focused) setEmissive(focused, 0.06);
  focused = p;
  setEmissive(p, 0.5);
  controls.autoRotate = false;
  tweening = true;

  const idx = p.userData.idx;
  const world = new THREE.Vector3();
  p.getWorldPosition(world);
  const d = Math.max(2.2, p.userData.Hh * p.scale.x * 1.6);
  const target = world.clone().add(new THREE.Vector3(0, 0, d));

  tweenCam(target, world, () => { tweening = false; });

  const desc = PRICES[[15,25,35,50][idx % 4]] || '约稿详谈 · 价格见右侧价目表';
  infoCard.querySelector('.title').textContent = `作品 ${String(idx+1).padStart(2,'0')}`;
  infoCard.querySelector('.desc').textContent = desc;
  infoCard.classList.add('show');
}

function unfocus() {
  if (focused) { setEmissive(focused, 0.06); focused = null; }
  infoCard.classList.remove('show');
  controls.autoRotate = true;
  tweening = true;
  tweenCam(new THREE.Vector3(0, 2.0, 10.5), new THREE.Vector3(0, 2.0, 0), () => tweening = false);
}

let camAnim = null;
const parallax = { x: 0, y: 0 };
const baseCamX = 0;
function tweenCam(pos, tgt, done) {
  camAnim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, t: 0, done };
}
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

/* ================= 键盘导航 ================= */
function focusByIndex(idx) {
  const p = paintings.find(g => g.userData.idx === idx);
  if (p) focus(p);
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {
    const next = focused ? (focused.userData.idx + 1) % COUNT : 0;
    focusByIndex(next);
  } else if (e.key === 'ArrowLeft') {
    const prev = focused ? (focused.userData.idx - 1 + COUNT) % COUNT : COUNT - 1;
    focusByIndex(prev);
  } else if (e.key === 'Escape') {
    unfocus();
  }
});

/* ================= 面板开关 ================= */
document.getElementById('togglePrice').addEventListener('click', () => {
  document.body.classList.toggle('panel-open');
  document.getElementById('pricePanel').classList.toggle('hidden-panel');
});

/* ================= 循环 ================= */
function animate(t) {
  requestAnimationFrame(animate);
  // 鼠标视差：未聚焦时相机轻微跟随鼠标
  if (!focused && !tweening) {
    parallax.x += (pointer.x * 1.2 - parallax.x) * 0.03;
    parallax.y += (pointer.y * 0.5 - parallax.y) * 0.03;
    camera.position.x = baseCamX + parallax.x;
    camera.position.y = 2.0 + parallax.y;
  }
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + 0.018);
    const e = easeInOut(camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) { const d = camAnim.done; camAnim = null; d && d(); }
  }
  // 轻微漂浮呼吸感
  paintings.forEach((p, i) => { p.position.y = 1.75 + Math.sin(t * 0.0008 + i) * 0.008; });
  controls.update();
  renderer.render(scene, camera);
}
animate(0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= 启动 ================= */
function init() {
  document.getElementById('loader').classList.add('hide');
}
</script>
</body>
</html>
