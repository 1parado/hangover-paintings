<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画橱 · Gallery</title>
<style>
  :root {
    --gold: #c9a86a;
    --gold-dim: #8a744a;
    --ink: #0e0c0a;
    --paper: #f2ead9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }

  #stage { position: fixed; inset: 0; display: block; }

  /* ---------- loading ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50; background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--gold); transition: opacity .8s ease; gap: 18px;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(201,168,106,.25); border-top-color: var(--gold);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .txt { letter-spacing: .5em; font-size: 14px; text-indent: .5em; opacity: .8; }

  /* ---------- header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px; pointer-events: none;
  }
  header .brand { color: var(--paper); font-size: 20px; letter-spacing: .35em; text-indent: .35em; }
  header .brand small { display: block; color: var(--gold-dim); font-size: 10px; letter-spacing: .6em; margin-top: 6px; }
  header .hint { color: rgba(242,234,217,.45); font-size: 12px; letter-spacing: .2em; }

  /* ---------- price panel ---------- */
  #pricePanel {
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    z-index: 10; width: 252px; max-height: 78vh;
    background: linear-gradient(160deg, rgba(24,20,15,.92), rgba(12,10,8,.94));
    border: 1px solid rgba(201,168,106,.35); border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 40px rgba(201,168,106,.05);
    padding: 24px 22px; overflow-y: auto; backdrop-filter: blur(8px);
    transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .5s;
  }
  #pricePanel.hidden-panel { transform: translateY(-50%) translateX(300px); opacity: 0; }
  #pricePanel::before {
    content: ""; position: absolute; inset: 6px; pointer-events: none;
    border: 1px solid rgba(201,168,106,.18);
  }
  #pricePanel h2 {
    color: var(--gold); font-size: 17px; letter-spacing: .5em; text-indent: .5em;
    text-align: center; margin-bottom: 4px; font-weight: 500;
  }
  #pricePanel .sub { color: var(--gold-dim); font-size: 10px; letter-spacing: .3em; text-align: center; margin-bottom: 18px; }
  #pricePanel ul { list-style: none; }
  #pricePanel li {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 2px; color: var(--paper); font-size: 13.5px; letter-spacing: .08em;
    border-bottom: 1px dashed rgba(201,168,106,.18);
  }
  #pricePanel li .price { color: var(--gold); font-size: 15px; }
  #pricePanel .note {
    margin-top: 16px; color: rgba(242,234,217,.5); font-size: 11.5px;
    line-height: 1.9; letter-spacing: .05em;
  }
  #pricePanel .note b { color: var(--gold); font-weight: normal; }

  /* ---------- toggle ---------- */
  #togglePrice {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 11; width: 34px; height: 76px;
    background: rgba(24,20,15,.9); border: 1px solid rgba(201,168,106,.35); border-right: none;
    color: var(--gold); cursor: pointer; font-size: 13px; letter-spacing: .1em;
    writing-mode: vertical-lr; display: flex; align-items: center; justify-content: center;
    transition: right .5s cubic-bezier(.22,1,.36,1);
  }
  body.panel-open #togglePrice { right: 284px; }

  /* ---------- artwork info card ---------- */
  #infoCard {
    position: fixed; left: 32px; bottom: 32px; z-index: 10;
    max-width: 340px; padding: 20px 24px;
    background: linear-gradient(160deg, rgba(24,20,15,.92), rgba(12,10,8,.94));
    border: 1px solid rgba(201,168,106,.35); border-left: 3px solid var(--gold);
    color: var(--paper); opacity: 0; transform: translateY(16px);
    transition: opacity .45s ease, transform .45s ease; pointer-events: none;
  }
  #infoCard.show { opacity: 1; transform: translateY(0); }
  #infoCard .title { font-size: 17px; letter-spacing: .15em; color: var(--gold); margin-bottom: 8px; }
  #infoCard .desc { font-size: 12.5px; line-height: 1.8; color: rgba(242,234,217,.75); letter-spacing: .06em; }

  /* ---------- footer ---------- */
  footer {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(242,234,217,.35); font-size: 11px; letter-spacing: .35em; z-index: 10; pointer-events: none;
  }

  #bgmToggle {
    position: fixed; left: 28px; top: 24px; z-index: 11;
    font-family: inherit; font-size: 12px; letter-spacing: .15em;
    padding: 8px 16px; border-radius: 17px; cursor: pointer; transition: background .3s;
  }
  #bgmToggle:hover { background: rgba(255,255,255,.75); }
  #bgmToggle.on { color: #2a2015; border-color: rgba(255,255,255,.9); background: rgba(255,244,214,.8); }

  /* ---------- 上一幅/下一幅（移动端） ---------- */
  #artNav {
    display: none;
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 11;
    gap: 12px;
  }
  #artNav button {
    width: 76px; height: 46px; border-radius: 23px;
    font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    touch-action: manipulation; user-select: none;
    transition: transform .2s, background .3s;
  }
  #artNav button:hover { background: rgba(255,255,255,.75); }
  #artNav button:active { transform: scale(.92); }
  #artNav .label { font-size: 11px; letter-spacing: .1em; }

  /* ---------- iOS 浅色玻璃控件 ---------- */
  .glass {
    background: rgba(255,255,255,.55);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    backdrop-filter: blur(18px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.65);
    box-shadow: 0 8px 24px rgba(120, 90, 70, .18), inset 0 1px 0 rgba(255,255,255,.8);
    color: #7a5c3e;
  }

  /* ---------- 转墙按钮 ---------- */
  .wallBtn {
    position: fixed; top: 62%; transform: translateY(-50%); z-index: 11;
    width: 46px; height: 64px; border-radius: 21px;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, background .3s; user-select: none; touch-action: manipulation;
  }
  .wallBtn:hover { background: rgba(255,255,255,.75); }
  .wallBtn:active { transform: translateY(-50%) scale(.92); }
  #wallLeft  { left: 14px; }
  #wallRight { right: 14px; }
  body.panel-open #wallRight { right: 288px; }

  @media (max-width: 768px) {
    header { padding: 14px 14px; }
    header .brand { font-size: 14px; letter-spacing: .2em; }
    header .hint { display: none; }
    #pricePanel { width: min(80vw, 260px); right: 12px; padding: 18px 16px; }
    body.panel-open #togglePrice { right: calc(min(80vw, 260px) + 12px); }
    #infoCard { left: 12px; right: 64px; bottom: 12px; max-width: none; padding: 14px 16px; }
    #bgmToggle { left: 12px; top: 12px; padding: 7px 12px; font-size: 11px; }
    .wallBtn { width: 52px; height: 84px; font-size: 24px; }
    #wallLeft { left: 8px; top: 62%; }
    #wallRight { right: 8px; top: 62%; }
    body.panel-open #wallRight { right: calc(min(80vw, 260px) + 12px); }
    footer { display: none; }
  }
</style>
</head>
<body class="panel-open" data-mobile-panel='{"closed":true}'>

<canvas id="stage"></canvas>

<div id="loader">
  <div class="ring"></div>
  <div class="txt">橱窗布置中</div>
</div>

<header>
  <div class="brand">画 橱<small>ART&nbsp;SHOWCASE</small></div>
  <div class="hint">拖动环视 · 滚轮缩放 · 点击画作查看</div>
</header>

<button id="togglePrice" title="展开/收起价目表">❦ 价目 ❦</button>

<aside id="pricePanel">
  <h2>稿价一览</h2>
  <div class="sub">COMMISSION&nbsp;PRICE</div>
  <ul>
    <li><span>大头线稿</span><span class="price">15r</span></li>
    <li><span>大头上色</span><span class="price">25r</span></li>
    <li><span>请吃Q版小人</span><span class="price">25r</span></li>
    <li><span>全身摸鱼线稿</span><span class="price">35r</span></li>
    <li><span>全身立绘线稿</span><span class="price">50r</span></li>
    <li><span>全身立绘上色＋背景</span><span class="price">200r</span></li>
    <li><span>大场景 or 刁钻角度</span><span class="price">300r</span></li>
    <li><span>小漫画 OC 剧情 4p</span><span class="price">250r</span></li>
  </ul>
  <div class="note">
    具体价格可详谈，以上只是预计价位～<br>
    加急：<b>＋15r</b> · 主包还是学生，请多关照<br>

  </div>
</aside>

<div id="infoCard">
  <div class="title"></div>
  <div class="desc"></div>
</div>

<button id="bgmToggle" class="glass" title="开关背景音乐">♪ 音乐:关</button>

<button class="wallBtn glass" id="wallLeft" title="看左边的墙">‹</button>
<button class="wallBtn glass" id="wallRight" title="看右边的墙">›</button>

<div id="artNav">
  <button id="artPrev" class="glass"><span>‹</span><span class="label">上一幅</span></button>
  <button id="artNext" class="glass"><span class="label">下一幅</span><span>›</span></button>
</div>

<footer>DRAWINGS&nbsp;·&nbsp;2026</footer>

<audio id="bgm" loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
               "tween": "https://unpkg.com/@tweenjs/tween.js@23.1.3/dist/tween.esm.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 数据 ================= */
const PRICES = {
  15:'大头线稿 · 15r', 25:'大头上色 · 25r', 35:'全身摸鱼线稿 · 35r', 50:'全身立绘线稿 · 50r'
};
const COUNT = 26;
const IMGS = [];
const EXT = { 9:'png', 13:'png', 15:'png' };
for (let i = 1; i <= COUNT; i++) IMGS.push(`img/art${String(i).padStart(2,'0')}.${EXT[i] || 'jpg'}`);

/* ================= 渲染器 / 场景 ================= */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2226);
scene.fog = new THREE.FogExp2(0x2a2226, 0.01);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 100);
// 移动端竖屏时拉远相机保证看到整面墙
function initialCamZ() {
  const ar = innerWidth / innerHeight;
  if (ar < 0.8) return 17;      // 竖屏手机
  if (ar < 1.2) return 13;      // 平板竖
  return 10.5;
}
// 竖屏时 FOV 加大以容纳全墙
const baseFov = innerWidth / innerHeight < 0.8 ? 62 : 50;
camera.fov = baseFov;
camera.position.set(0, 2.0, initialCamZ());

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.2;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = false;

/* ================= 灯光 ================= */
scene.add(new THREE.AmbientLight(0xfff0f2, 2.0));
scene.add(new THREE.HemisphereLight(0xfff0f4, 0xd9a8a0, 1.1));

const keyLight = new THREE.DirectionalLight(0xfff0f4, 1.7);
keyLight.position.set(0, 8, 10);
scene.add(keyLight);

function spotlight(x, y, z, targetY = 1.7) {
  const s = new THREE.SpotLight(0xffeed0, 120, 25, 0.7, 0.8, 1.2);
  s.position.set(x, y, z);
  s.castShadow = false;
  scene.add(s, s.target);
  s.target.position.set(x, targetY, z * 0.2);
  return s;
}

// 只用 3 盏宽射灯覆盖整面墙（灯光数量过多会导致闪烁）
// （在下方房间区域定义 WALL_Z 后统一布置）

/* ================= 房间 ================= */
const room = new THREE.Group();
scene.add(room);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2e4e0, roughness: 0.95 });   // 樱花粉白墙
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x8a5f4d, roughness: 0.3, metalness: 0.08   // 暖粉棕木地板
});
const R = 30;               // 展厅纵深（背景墙很远）
const H = 7;
const WALL_Z = -7;          // 正面展示墙
const WALL_W = 30;

// 地面
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
room.add(floor);

// 正面大墙 + 侧墙
const wallMat2 = wallMat.clone();
const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(WALL_W, H + 4), wallMat2);
frontWall.position.set(0, (H + 4)/2 - 0.5, WALL_Z);
frontWall.receiveShadow = true;
room.add(frontWall);
// 后墙位置（房间进深加大保证观赏位在室内）
const BACK_Z = WALL_Z + 32;

const sideL = new THREE.Mesh(new THREE.PlaneGeometry(BACK_Z - WALL_Z, H + 4), wallMat);
sideL.position.set(-WALL_W/2, 2.5, (BACK_Z + WALL_Z)/2); sideL.rotation.y = Math.PI/2;
room.add(sideL);
const sideR = new THREE.Mesh(new THREE.PlaneGeometry(BACK_Z - WALL_Z, H + 4), wallMat);
sideR.position.set(WALL_W/2, 2.5, (BACK_Z + WALL_Z)/2); sideR.rotation.y = -Math.PI/2;
room.add(sideR);

// 后墙（正面墙对面）
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(WALL_W, H + 4), wallMat2);
backWall.position.set(0, (H + 4)/2 - 0.5, BACK_Z);
backWall.rotation.y = Math.PI;
room.add(backWall);

// 墙脚线
const trimMat = new THREE.MeshStandardMaterial({ color: 0x3a2f1e, roughness: .5, metalness: .6 });
const trimBox = new THREE.Mesh(new THREE.BoxGeometry(WALL_W + 1, 0.14, 0.2), trimMat);
trimBox.position.set(0, 0.07, WALL_Z + 0.1);
room.add(trimBox);

// 3 盏宽射灯覆盖整面墙（灯光数量过多会导致着色器闪烁）
[[-9, 1.5], [0, 1.5], [9, 1.5]].forEach(([x]) => spotlight(x, 6.2, WALL_Z + 4.5, 1.5));

// 天花板
const ceiling2 = new THREE.Mesh(new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0xfaeef0, roughness: 1 }));
ceiling2.rotation.x = Math.PI/2; ceiling2.position.y = H;
room.add(ceiling2);

// 粉色踢脚线（三面墙）
const skirtMat = new THREE.MeshStandardMaterial({ color: 0xe8b4c0, roughness: .6 });
function skirt(cx, cz, len, rotY) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(len, 0.16, 0.06), skirtMat);
  s.position.set(cx, 0.08, cz); s.rotation.y = rotY;
  room.add(s);
}
skirt(0, WALL_Z + 0.05, WALL_W, 0);
skirt(-WALL_W/2 + 0.03, WALL_Z + WALL_W/2, WALL_W, Math.PI/2);
skirt(WALL_W/2 - 0.03, WALL_Z + WALL_W/2, WALL_W, Math.PI/2);

// 彩旗串（跨厅，二次元氛围）
const flagColors = [0xff9eb5, 0xffd383, 0x9ed8ff, 0xc7f0c2, 0xe4c4ff];
function flagLine(x1, z1, x2, z2, y) {
  const n = 14;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const sag = Math.sin(t * Math.PI) * 0.28;
    const fl = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.22, 3),
      new THREE.MeshStandardMaterial({ color: flagColors[i % 5], roughness: .8, side: THREE.DoubleSide }));
    fl.position.set(x1 + (x2-x1)*t, y - sag - 0.1, z1 + (z2-z1)*t);
    fl.rotation.x = Math.PI;
    room.add(fl);
  }
}
flagLine(-10, 3.5, 10, 3.5, H - 0.6);
flagLine(-WALL_W/2 + 0.5, WALL_Z + 6, 0, WALL_Z + 6, H - 0.6);
flagLine(0, WALL_Z + 6, WALL_W/2 - 0.5, WALL_Z + 6, H - 0.6);

// 天花板轨道灯条
const trackMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: .4, metalness: .7 });
const track = new THREE.Mesh(new THREE.BoxGeometry(WALL_W * 0.8, 0.06, 0.12), trackMat);
track.position.set(0, H - 0.1, WALL_Z + 2.2);
room.add(track);
for (let i = 0; i < 13; i++) {
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.07, 0.18, 10), trackMat);
  head.position.set(-WALL_W*0.4 + i * (WALL_W*0.8/12), H - 0.22, WALL_Z + 2.2);
  head.rotation.x = 0.45;
  room.add(head);
}

// （长椅已按需求移除）

/* ================= 画框 ================= */
const frameMat  = new THREE.MeshStandardMaterial({ color: 0x2e2114, roughness: 0.35, metalness: 0.55 });
const goldMat   = new THREE.MeshStandardMaterial({ color: 0x8a744a, roughness: 0.3,  metalness: 0.8 });
const matBoardMat = new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.95 });
const planeGeo  = new THREE.PlaneGeometry(1, 1);

const paintings = [];
const loader = new THREE.TextureLoader();
let loaded = 0;

function addPainting(tex, idx) {
  const img = tex.image;
  const ratio = img.height / img.width;
  const W = 2.6 / Math.sqrt(ratio);   // 面积大致一致
  const Hh = W * ratio;
  const g = new THREE.Group();

  // 画框设计：外深木框 + 内金斜边 + 画布留白衬边（passe-partout）
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, Hh + 0.3, 0.07), frameMat);
  g.add(frame);                                  // 前表面 z=0.035
  // 金色内衬斜边（略小于外框，凸出）
  const bevel = new THREE.Mesh(new THREE.BoxGeometry(W + 0.16, Hh + 0.16, 0.05), goldMat);
  bevel.position.z = 0.045;                      // 前表面 z=0.07
  g.add(bevel);
  // 卡纸衬边（米白，位于金边内、画布后）
  const mat = new THREE.Mesh(new THREE.BoxGeometry(W + 0.04, Hh + 0.04, 0.045), matBoardMat);
  mat.position.z = 0.055;                        // 前表面 z≈0.078，略低于画布
  g.add(mat);
  // 画布
  tex.colorSpace = THREE.SRGBColorSpace;
  const artMat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.9, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.08,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4
  });
  // 检测画面亮度：白纸线稿自动压暗，避免刺眼
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 16;
    const cx = c.getContext('2d');
    cx.drawImage(tex.image, 0, 0, 16, 16);
    const d = cx.getImageData(0, 0, 16, 16).data;
    let lum = 0;
    for (let i = 0; i < d.length; i += 4) lum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    lum /= d.length / 4;
    if (lum > 170) {                // 亮背景（未上色线稿）
      artMat.color = new THREE.Color(0xb9b2a6);   // 暖灰压暗
      artMat.emissiveIntensity = 0;
    }
  } catch (e) {}
  const art = new THREE.Mesh(planeGeo, artMat);
  art.scale.set(W, Hh, 1);
  art.position.z = 0.105;                        // 前表面 z=0.105，衬边之上
  g.add(art);

  // 挂绳 + 钉子（装饰）
  const hook = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), goldMat);
  hook.position.set(0, Hh/2 + 0.28, 0.02);
  g.add(hook);

  // 画下方铭牌
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x6b5a3a, metalness: .7, roughness: .35 }));
  plate.position.set(0, -Hh/2 - 0.22, 0.02);
  g.add(plate);

  // ---- 放置：四面墙，每面墙单行 ----
  // 墙定义：法线朝向展厅中心；顺序 0正 1右 2后 3左（导航沿顺时针）
  const walls = [
    { pos: new THREE.Vector3(0, 0, WALL_Z),                     rotY: 0 },           // 正面墙
    { pos: new THREE.Vector3( WALL_W/2, 0, WALL_Z + WALL_W/2),  rotY: -Math.PI/2 },  // 右墙
    { pos: new THREE.Vector3(0, 0, BACK_Z),                     rotY: Math.PI },     // 后墙
    { pos: new THREE.Vector3(-WALL_W/2, 0, WALL_Z + WALL_W/2),  rotY: Math.PI/2 },   // 左墙
  ];
  const perWall = Math.ceil(COUNT / 4);             // 每面墙 7 幅（26/4）
  const wallIdx = Math.floor(idx / perWall);        // 0..3
  const iIn = idx % perWall;
  const nOn = Math.min(perWall, COUNT - wallIdx * perWall);
  const col = iIn;
  const cellW = WALL_W / perWall;
  // 单行居中：nOn 幅占 WALL_W 中 nOn*cellW 的宽度，从居中位置排
  const localX = -(nOn * cellW) / 2 + cellW * (col + 0.5);
  const localY = 2.4;
  const scale = Math.min(1, cellW / (W + 0.5)) * 0.92;
  g.scale.setScalar(scale);
  const wl = walls[wallIdx];
  g.position.copy(wl.pos);
  g.rotation.y = wl.rotY;
  // 沿墙局部 x 轴偏移 + 略离墙面
  const right = new THREE.Vector3(Math.cos(wl.rotY), 0, -Math.sin(wl.rotY));
  const out   = new THREE.Vector3(Math.sin(wl.rotY), 0,  Math.cos(wl.rotY));
  g.position.add(right.multiplyScalar(localX));
  g.position.add(out.multiplyScalar(0.15));
  g.position.y = localY;

  // 射灯已在场景初始化时统一布置（数量过多会导致着色器不稳定/闪烁）

  g.userData = { idx, W, Hh, baseY: localY, wallIdx, localX };
  paintings.push(g);
  room.add(g);
}

IMGS.forEach((src, idx) => {
  loader.load(src, tex => {
    addPainting(tex, idx);
    if (++loaded === COUNT) init();
  }, undefined, () => { if (++loaded === COUNT) init(); }); // 失败也继续
});

/* ================= 交互 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null, focused = null, tweening = false;
const infoCard = document.getElementById('infoCard');

function pick(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(paintings, true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o && !o.userData.idx) o = o.parent;
  return o && o.userData.idx ? o : null;
}

function setEmissive(p, v) {
  p.children.forEach(c => {
    if (c.material && c.material.emissiveMap) c.material.emissiveIntensity = v;
  });
}

canvas.addEventListener('pointermove', e => {
  if (tweening) return;
  const p = pick(e);
  if (p !== hovered) {
    if (hovered && hovered !== focused) setEmissive(hovered, 0.06);
    hovered = p;
    if (hovered) setEmissive(hovered, 0.35);
    canvas.style.cursor = hovered ? 'pointer' : 'grab';
  }
});

canvas.addEventListener('click', e => {
  const p = pick(e);
  if (!p) { unfocus(); return; }
  focus(p);
});

function focus(p) {
  if (focused) setEmissive(focused, 0.06);
  focused = p;
  setEmissive(p, 0.5);
  controls.autoRotate = false;
  tweening = true;

  const idx = p.userData.idx;
  const world = new THREE.Vector3();
  p.getWorldPosition(world);
  // 相机飞到画的正前方（沿画的朝向外移）
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(p.quaternion);
  const d = Math.max(2.2, p.userData.Hh * p.scale.x * 1.6);
  const target = world.clone().add(normal.multiplyScalar(d));
  target.y = world.y;

  tweenCam(target, world, () => { tweening = false; });

  const desc = PRICES[[15,25,35,50][idx % 4]] || '约稿详谈 · 价格见右侧价目表';
  infoCard.querySelector('.title').textContent = `作品 ${String(idx+1).padStart(2,'0')}`;
  infoCard.querySelector('.desc').textContent = desc;
  infoCard.classList.add('show');
}

function unfocus() {
  if (focused) { setEmissive(focused, 0.06); focused = null; }
  infoCard.classList.remove('show');
  controls.autoRotate = true;
  tweening = true;
  tweenCam(new THREE.Vector3(0, 2.0, 10.5), new THREE.Vector3(0, 2.0, 0), () => tweening = false);
}

let camAnim = null;
const parallax = { x: 0, y: 0 };
const baseCamX = 0;
function tweenCam(pos, tgt, done) {
  camAnim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, t: 0, done };
}
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

/* ================= 键盘导航 ================= */
// 直接按编号 01→26 循环，与墙的分布无关，直觉清晰
function focusByIndex(idx) {
  const p = paintings.find(g => g.userData.idx === idx);
  if (p) focus(p);
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    let idx = focused ? focused.userData.idx + dir : (dir > 0 ? 0 : COUNT - 1);
    idx = ((idx % COUNT) + COUNT) % COUNT;
    focusByIndex(idx);
  } else if (e.key === 'Escape') {
    unfocus();
  }
});

/* ================= 上一幅/下一幅按钮（移动端） ================= */
const artNav = document.getElementById('artNav');
function isTouchLike() {
  return matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 768px)').matches;
}
function updateArtNav() {
  artNav.style.display = isTouchLike() ? 'flex' : 'none';
}
document.getElementById('artPrev').addEventListener('click', () => {
  let idx = focused ? focused.userData.idx - 1 : COUNT - 1;
  idx = ((idx % COUNT) + COUNT) % COUNT;
  focusByIndex(idx);
});
document.getElementById('artNext').addEventListener('click', () => {
  let idx = focused ? focused.userData.idx + 1 : 0;
  idx = ((idx % COUNT) + COUNT) % COUNT;
  focusByIndex(idx);
});
updateArtNav();
addEventListener('resize', updateArtNav);

/* ================= 转墙按钮 ================= */
// 相机飞到某面墙正前方的观赏位
const camZ0 = initialCamZ();
const WALL_VIEWS = [
  { pos: new THREE.Vector3(0, 2.0, camZ0),            tgt: new THREE.Vector3(0, 2.0, WALL_Z) },             // 正面
  { pos: new THREE.Vector3( camZ0, 2.0, WALL_Z + WALL_W/2), tgt: new THREE.Vector3( WALL_W/2, 2.0, WALL_Z + WALL_W/2) }, // 右墙
  { pos: new THREE.Vector3(0, 2.0, BACK_Z - camZ0), tgt: new THREE.Vector3(0, 2.0, BACK_Z) },                  // 后墙
  { pos: new THREE.Vector3(-camZ0, 2.0, WALL_Z + WALL_W/2), tgt: new THREE.Vector3(-WALL_W/2, 2.0, WALL_Z + WALL_W/2) },// 左墙
];
let curWall = 0;
function viewWall(i) {
  curWall = ((i % 4) + 4) % 4;
  if (focused) { setEmissive(focused, 0.06); focused = null; infoCard.classList.remove('show'); }
  controls.autoRotate = false;
  tweening = true;
  tweenCam(WALL_VIEWS[curWall].pos.clone(), WALL_VIEWS[curWall].tgt.clone(), () => tweening = false);
}
document.getElementById('wallLeft').addEventListener('click', () => viewWall(curWall - 1));
document.getElementById('wallRight').addEventListener('click', () => viewWall(curWall + 1));

/* ================= 初始状态：移动端默认收起价目面板 ================= */
if (matchMedia('(max-width: 768px)').matches) {
  document.body.classList.remove('panel-open');
  document.getElementById('pricePanel').classList.add('hidden-panel');
}

/* ================= BGM ================= */
const bgm = document.getElementById('bgm');
const bgmToggle = document.getElementById('bgmToggle');
bgmToggle.addEventListener('click', () => {
  if (bgm.paused) {
    bgm.volume = 0.45;
    bgm.play().then(() => bgmToggle.textContent = '♪ 音乐:开').catch(() => {
      bgmToggle.textContent = '♪ 未找到bgm.mp3';
    });
  } else {
    bgm.pause();
    bgmToggle.textContent = '♪ 音乐:关';
  }
});

/* ================= 面板开关 ================= */
document.getElementById('togglePrice').addEventListener('click', () => {
  document.body.classList.toggle('panel-open');
  document.getElementById('pricePanel').classList.toggle('hidden-panel');
});

/* ================= 循环 ================= */
const isTouch = matchMedia('(pointer: coarse)').matches;
function animate(t) {
  requestAnimationFrame(animate);
  // 鼠标视差：未聚焦时相机轻微跟随鼠标（触摸设备关闭）
  if (!focused && !tweening && !isTouch) {
    parallax.x += (pointer.x * 1.2 - parallax.x) * 0.03;
    parallax.y += (pointer.y * 0.5 - parallax.y) * 0.03;
    camera.position.x = baseCamX + parallax.x;
    camera.position.y = 2.0 + parallax.y;
  }
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + 0.018);
    const e = easeInOut(camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) { const d = camAnim.done; camAnim = null; d && d(); }
  }
  // 轻微漂浮呼吸感
  paintings.forEach((p, i) => { p.position.y = p.userData.baseY + Math.sin(t * 0.0008 + i) * 0.008; });
  controls.update();
  renderer.render(scene, camera);
}
animate(0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= 启动 ================= */
function init() {
  document.getElementById('loader').classList.add('hide');
}
</script>
